name: Plugin asset/readme update

on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  assets:
    name: Push readme and assets to WP.org
    runs-on: ubuntu-latest
    steps:
      - name: Check SVN credentials
        id: creds
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -z "$SVN_USERNAME" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SVN_USERNAME is not set; skipping WordPress.org update."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: WordPress.org plugin asset/readme update
        if: steps.creds.outputs.configured == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: list-child-pages-shortcode
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
