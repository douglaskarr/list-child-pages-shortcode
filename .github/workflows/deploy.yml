name: Deploy to WordPress.org

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    # action-gh-release uploads the plugin zip onto the existing GitHub release.
    permissions:
      contents: write
    steps:
      - name: Check SVN credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -z "$SVN_USERNAME" ]; then
            echo "Set repository secrets SVN_USERNAME and SVN_PASSWORD before releasing." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: list-child-pages-shortcode
          ASSETS_DIR: .wordpress-org

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
